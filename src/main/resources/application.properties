spring.application.name=crudDtoDemo

# ===============================
# H2 Database
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# Application
# ===============================
app.env=LOCAL
# h2connect.enable=false

# ===============================
# Hibernate Second-Level Cache
# ===============================

# Disabled because Ehcache is not needed for basic CRUD
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Not required when caching is disabled
# spring.jpa.properties.hibernate.cache.region.factory_class=jcache
# spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
# spring.jpa.properties.hibernate.javax.cache.uri=ehcache.xml

# Enable only when debugging Hibernate performance
# spring.jpa.properties.hibernate.generate_statistics=true

# ===============================
# JWT Authentication
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000


# Actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/manage

# Show health details
management.endpoint.health.show-details=always

# Application information
management.info.env.enabled=true
info.app.name=crudDtoDemo
info.app.description=Spring Boot practice application
info.app.version=1.0.0